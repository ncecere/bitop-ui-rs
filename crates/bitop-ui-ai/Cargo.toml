[package]
name = "bitop-ui-ai"
description = "Chat and agent components for Topcoat, built on bitop-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bitop-ui.workspace = true
# Markdown for `response`: GFM tables, strikethrough and task lists. The HTML is
# written by `markdown.rs`, which sanitises it, so the crate's own writer is not used.
pulldown-cmark = { version = "0.13", default-features = false }
topcoat = { workspace = true }

[build-dependencies]
bitop-ui-build.workspace = true

[lints]
workspace = true
